{% extends 'base.html' %}{% from 'macros.html' import table,paging with context %}{% block content %}<div class="page-heading"><div><div class="eyebrow">CUSTOMER CARE</div><h1>Support tickets</h1><p>Keep every customer request moving toward resolution.</p></div><span class="pill">Assistenza</span></div><section class="panel"><form class="filters"><input type="hidden" name="user" value="{{selected_user.get('email','')}}"><input type="hidden" name="team" value="{{1 if team else 0}}"><label>View<select name="view"><option value="all">All records</option><option value="my" {{'selected' if request.query_params.get('view')=='my'}}>My records</option></select></label><label>Stage<select name="stage"><option value="">All stages</option>{% for value in ['assistenza_open','assistenza_working','assistenza_waiting','assistenza_closed'] %}<option value="{{value}}" {{'selected' if value==stage}}>{{value|stage}}</option>{% endfor %}</select></label><label>Priority<select name="priority"><option value="">All priorities</option>{% for value in ['LOW','MEDIUM','HIGH','URGENT'] %}<option {{'selected' if priority==value}}>{{value}}</option>{% endfor %}</select></label><label>Assignee<input name="assegnatario" value="{{assegnatario}}" placeholder="Assignee email"></label><button>Apply filters</button></form>{{table(rows,'tickets')}}{{paging(cursor)}}</section>{% endblock %}
